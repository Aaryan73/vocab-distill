[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-distill"
version = "0.1.0"
description = "Extend a language model's vocabulary without losing accuracy, via boundary-aligned self-distillation"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["vocab_distill"]
